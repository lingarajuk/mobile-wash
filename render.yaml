# AquaGo Wash - Render Blueprint Specification
# Infrastructure as Code for Render Web Services and Static Sites

services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: aquago-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mockkey123
      - key: RAZORPAY_KEY_SECRET
        value: rzp_secret_mocksecret456

  # 2. Customer Web App (Static Site)
  - type: web
    name: aquago-customer
    runtime: static
    buildCommand: npm install && npm run build:customer
    staticPublishPath: ./dist/customer
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # 3. Worker Web App (Static Site)
  - type: web
    name: aquago-worker
    runtime: static
    buildCommand: npm install && npm run build:worker
    staticPublishPath: ./dist/worker
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

  # 4. Admin Web App (Static Site)
  - type: web
    name: aquago-admin
    runtime: static
    buildCommand: npm install && npm run build:admin
    staticPublishPath: ./dist/admin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
